<svg xmlns="http://www.w3.org/2000/svg" style="background:white;color:#203044" viewBox="0 0 1000 460" role="img" aria-label="Узел крупно. Слева — вид сбоку вдоль оси: на плите рамы подошва — стальная пластина 5 мм, на ней пятка ноги 35 мм и две щеки-уголка вплотную спереди и сзади; болты М8 через полку щеки, подошву, плиту и такую же подкладку снизу, в 25 мм от стенки, 95 мм между болтами; поперечный болт М10 над осью за ногой. Справа — вид сверху на половину рамы 175×180: щёки длиной 60 мм не выходят наружу за ногу, по 2 отверстия на щеку в 13 и 43 мм от торца щеки, под щеками и ногой — пластина 60×120 вровень с наружной гранью ноги."><style>:root{--ink:#172537;--bg:#fff;--muted:#596775;--line:#c0cbd4;--surface:#fff;--blue:#1b5a9c;--blue-soft:#daeafa;--signal:#bc4d20;--var:#667788;--acc:#185bb1;font-family:Arial,sans-serif}
:root {
  --bg: #f3f6f9;        /* снег */
  --surface: #ffffff;
  --ink: #142231;       /* тёмно-синие чернила */
  --muted: #5a6878;
  --line: #d3dbe4;
  --blue: #1d5bb8;      /* порошковая краска тележки */
  --blue-soft: #e3ecf8;
  --signal: #d4500f;    /* рычаг и «важно» */
  --signal-soft: #fbe9df;
  --ok: #2f7d4f;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0d141c; --surface: #141e29; --ink: #e5ecf3; --muted: #93a2b2; --line: #263445;
  --blue: #74a6f2; --blue-soft: #18283c; --signal: #ff8a4f; --signal-soft: #3a2114; --ok: #6cc592;
  color-scheme: dark;
}

svg text { font-family: var(--f-body); font-size: 13px; fill: currentColor; }

svg .t-s { font-size: 11.5px; fill: var(--muted); }

svg .t-b { font-weight: 600; }

svg .t-sig { fill: var(--signal); font-weight: 600; }

svg .t-acc { fill: var(--blue); font-weight: 600; }

svg .ln { stroke: currentColor; fill: none; stroke-width: 1.6; }

svg .thin { stroke: var(--muted); fill: none; stroke-width: 1; }

svg .lead { stroke: var(--muted); fill: none; stroke-width: 0.9; }

svg .acc { stroke: var(--blue); fill: var(--blue-soft); stroke-width: 1.8; }

svg .accf { fill: var(--blue); stroke: none; }

svg .sig { stroke: var(--signal); fill: none; stroke-width: 2.2; }

svg .sigf { fill: var(--signal); stroke: none; }

svg .cab { stroke: var(--signal); fill: none; stroke-width: 1.8; stroke-dasharray: 6 4; }

svg .steel { stroke: currentColor; fill: var(--bg); stroke-width: 1.4; }

svg .shaft { fill: var(--muted); stroke: currentColor; stroke-width: 1; }

svg .tyre { stroke: currentColor; fill: var(--line); stroke-width: 1.4; }

svg .box { stroke: currentColor; fill: var(--surface); stroke-width: 1.4; }

svg .alu { stroke: currentColor; fill: var(--line); stroke-width: 1.2; }

svg .hid { stroke: var(--muted); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; }

svg .hidb { stroke: var(--signal); fill: none; stroke-width: 1.4; stroke-dasharray: 4 3; }

svg .cheek { stroke: currentColor; fill: var(--blue); fill-opacity: .28; stroke-width: 1.4; }

svg .bolt { fill: var(--signal); fill-opacity: .85; stroke: none; }

svg .co { fill: var(--signal); stroke: var(--surface); stroke-width: 2; }

svg .co-t { fill: var(--surface); font-weight: 600; font-size: 12px; }

svg .axis { stroke: var(--blue); stroke-width: 1.1; stroke-dasharray: 10 3 2 3; fill: none; }</style><defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><text x="255" y="22" text-anchor="middle" class="t-b">Сбоку, вдоль оси (разрез по ноге)</text><text x="695.6" y="22" text-anchor="middle" class="t-b">Сверху, одна половина рамы</text><line x1="530" y1="34" x2="530" y2="450" class="thin" stroke-dasharray="3 4"/><rect x="46.2" y="300" width="417.6" height="14.5" class="alu"/><rect x="81" y="314.5" width="348" height="14.5" class="steel"/><rect x="81" y="285.5" width="348" height="14.5" class="steel"/><rect x="204.2" y="73.8" width="101.5" height="211.7" class="steel" fill="var(--blue-soft)"/><path d="M204.2,73.8 l12,-6 l12,8 l12,-6 l12,8 l12,-6 l11.5,6" class="ln"/><circle cx="255" cy="221.7" r="22.6" class="shaft"/><polygon points="305.8,285.5 450.8,285.5 450.8,271 320.2,271 320.2,140.5 305.8,140.5" class="cheek"/><rect x="381.1" y="251" width="23.2" height="114.6" class="bolt"/><rect x="369.6" y="266.4" width="46.4" height="4.6" class="steel"/><rect x="373.9" y="251" width="37.7" height="15.4" class="sigf"/><rect x="369.6" y="329" width="46.4" height="4.6" class="steel"/><rect x="373.9" y="333.6" width="37.7" height="23.2" class="sigf"/><polygon points="204.2,285.5 59.2,285.5 59.2,271 189.8,271 189.8,140.5 204.2,140.5" class="cheek"/><rect x="105.7" y="251" width="23.2" height="114.6" class="bolt"/><rect x="94.1" y="266.4" width="46.4" height="4.6" class="steel"/><rect x="98.4" y="251" width="37.7" height="15.4" class="sigf"/><rect x="94.1" y="329" width="46.4" height="4.6" class="steel"/><rect x="98.4" y="333.6" width="37.7" height="23.2" class="sigf"/><rect x="165.4" y="165.7" width="221.6" height="29" class="hidb"/><rect x="165.4" y="157" width="18.6" height="46.4" class="sigf"/><rect x="326.1" y="157" width="29" height="46.4" class="sigf"/><line x1="255" y1="33.2" x2="255" y2="375.4" class="axis"/><line x1="204.2" y1="50.6" x2="305.8" y2="50.6" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><line x1="204.2" y1="45.6" x2="204.2" y2="55.6" class="thin"/><line x1="305.8" y1="45.6" x2="305.8" y2="55.6" class="thin"/><text x="255" y="44.6" text-anchor="middle" class="t-s">35 — нога</text><line x1="320.2" y1="114.4" x2="392.8" y2="114.4" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><line x1="320.2" y1="109.4" x2="320.2" y2="119.4" class="thin"/><line x1="392.8" y1="109.4" x2="392.8" y2="119.4" class="thin"/><text x="356.5" y="108.4" text-anchor="middle" class="t-s">25</text><line x1="117.2" y1="372.5" x2="392.8" y2="372.5" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><line x1="117.2" y1="367.5" x2="117.2" y2="377.5" class="thin"/><line x1="392.8" y1="367.5" x2="392.8" y2="377.5" class="thin"/><text x="255" y="366.5" text-anchor="middle" class="t-s">95 между болтами</text><line x1="81" y1="410.2" x2="429" y2="410.2" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><line x1="81" y1="405.2" x2="81" y2="415.2" class="thin"/><line x1="429" y1="405.2" x2="429" y2="415.2" class="thin"/><text x="255" y="425.2" text-anchor="middle" class="t-s">120 — подошва и подкладка</text><line x1="469.6" y1="285.5" x2="469.6" y2="140.5" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><text x="475.6" y="217" class="t-s">50 — щека</text><line x1="197" y1="169.5" x2="34.6" y2="137.6" class="lead"/><circle cx="34.6" cy="137.6" r="10" class="co"/><text x="34.6" y="141.9" text-anchor="middle" class="co-t">3</text><line x1="117.2" y1="250.7" x2="34.6" y2="207.2" class="lead"/><circle cx="34.6" cy="207.2" r="10" class="co"/><text x="34.6" y="211.5" text-anchor="middle" class="co-t">5</text><line x1="75.2" y1="292.8" x2="34.6" y2="265.2" class="lead"/><circle cx="34.6" cy="265.2" r="10" class="co"/><text x="34.6" y="269.5" text-anchor="middle" class="co-t">4</text><line x1="75.2" y1="321.8" x2="34.6" y2="346.4" class="lead"/><circle cx="34.6" cy="346.4" r="10" class="co"/><text x="34.6" y="350.7" text-anchor="middle" class="co-t">4</text><line x1="355.1" y1="180.2" x2="429" y2="131.8" class="lead"/><circle cx="429" cy="131.8" r="10" class="co"/><text x="429" y="136.1" text-anchor="middle" class="co-t">6</text><text x="434.8" y="344" class="t-s">плита рамы</text><text x="255" y="225.7" text-anchor="middle" class="t-s">ось</text><text x="255" y="444.2" text-anchor="middle" class="t-s">штрихпунктир — ось мотора: точно под центром ноги, ±5 мм</text><path d="M371,21.6 h46" class="lead" marker-end="url(#arB)"/><text x="423" y="25.6" class="t-s">вперёд</text><rect x="560" y="120.5" width="271.2" height="279" class="alu"/><text x="695.6" y="112.5" text-anchor="middle" class="t-s">половина рамы ≈175 × 180 снаружи</text><rect x="569.3" y="154.6" width="252.7" height="210.8" rx="14" class="hid"/><circle cx="804.9" cy="148.4" r="17.1" class="hid"/><circle cx="804.9" cy="371.6" r="17.1" class="hid"/><text x="792.5" y="415.5" text-anchor="middle" class="t-s">отверстия датчиков — не мешают</text><rect x="831.2" y="238.3" width="88.4" height="43.4" class="shaft"/><text x="877.8" y="232.3" text-anchor="middle" class="t-s">мотор →</text><text x="563.1" y="415.5" class="t-s">← шарнир</text><rect x="583.2" y="167" width="93" height="186" class="steel" fill-opacity="0.55"/><rect x="580.1" y="225.1" width="93" height="7.8" class="steel" fill="var(--blue)" fill-opacity="0.35"/><rect x="580.1" y="155.4" width="93" height="69.8" class="cheek"/><circle cx="653" cy="186.4" r="6.6" class="sigf"/><circle cx="606.5" cy="186.4" r="6.6" class="sigf"/><rect x="580.1" y="287.1" width="93" height="7.8" class="steel" fill="var(--blue)" fill-opacity="0.35"/><rect x="580.1" y="294.9" width="93" height="69.8" class="cheek"/><circle cx="653" cy="333.6" r="6.6" class="sigf"/><circle cx="606.5" cy="333.6" r="6.6" class="sigf"/><rect x="639" y="232.9" width="37.2" height="54.2" class="steel" fill="var(--blue-soft)"/><rect x="541.4" y="247.9" width="227.9" height="24.2" class="shaft"/><rect x="615.8" y="212.1" width="15.5" height="118.4" class="bolt"/><rect x="677.8" y="235.2" width="6.2" height="49.6" class="steel"/><rect x="684" y="244.5" width="69.8" height="31" class="box" fill-opacity="0.9"/><line x1="580.1" y1="136" x2="673.1" y2="136" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><text x="626.6" y="131" text-anchor="middle" class="t-s">60 — щека</text><line x1="606.5" y1="384" x2="673.1" y2="384" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><text x="639.8" y="398" text-anchor="middle" class="t-s">43</text><line x1="653" y1="408.8" x2="673.1" y2="408.8" class="lead" marker-start="url(#arB)" marker-end="url(#arB)"/><text x="663.1" y="422.8" text-anchor="middle" class="t-s">13</text><line x1="614.2" y1="182.5" x2="538.3" y2="142.2" class="lead"/><circle cx="538.3" cy="142.2" r="10" class="co"/><text x="538.3" y="146.5" text-anchor="middle" class="co-t">3</text><line x1="598.8" y1="346.8" x2="538.3" y2="377.8" class="lead"/><circle cx="538.3" cy="377.8" r="10" class="co"/><text x="538.3" y="382.1" text-anchor="middle" class="co-t">4</text><line x1="653" y1="333.6" x2="738.2" y2="349.9" class="lead"/><circle cx="738.2" cy="349.9" r="10" class="co"/><text x="738.2" y="354.2" text-anchor="middle" class="co-t">5</text><line x1="623.5" y1="306.5" x2="538.3" y2="294.1" class="lead"/><circle cx="538.3" cy="294.1" r="10" class="co"/><text x="538.3" y="298.4" text-anchor="middle" class="co-t">6</text><line x1="722.8" y1="260" x2="744.5" y2="198" class="lead"/><circle cx="744.5" cy="198" r="10" class="co"/><text x="744.5" y="202.3" text-anchor="middle" class="co-t">7</text></svg>