<svg xmlns="http://www.w3.org/2000/svg" style="background:white;color:#203044" viewBox="0 0 1000 440" role="img" aria-label="Вид сзади: стойка «П» тележки с родной приварной осью стоит ногами на двух половинах рамы гироскутера; у каждой ноги — вилка из двух щёк-уголков, подошва и подкладка из стальной пластины, 4 болта М8 насквозь через раму и поперечный болт над осью; моторы в родных прижимах, шарнир посередине не трогаем."><style>:root{--ink:#172537;--bg:#fff;--muted:#596775;--line:#c0cbd4;--surface:#fff;--blue:#1b5a9c;--blue-soft:#daeafa;--signal:#bc4d20;--var:#667788;--acc:#185bb1;font-family:Arial,sans-serif}
:root {
  --bg: #f3f6f9;        /* снег */
  --surface: #ffffff;
  --ink: #142231;       /* тёмно-синие чернила */
  --muted: #5a6878;
  --line: #d3dbe4;
  --blue: #1d5bb8;      /* порошковая краска тележки */
  --blue-soft: #e3ecf8;
  --signal: #d4500f;    /* рычаг и «важно» */
  --signal-soft: #fbe9df;
  --ok: #2f7d4f;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0d141c; --surface: #141e29; --ink: #e5ecf3; --muted: #93a2b2; --line: #263445;
  --blue: #74a6f2; --blue-soft: #18283c; --signal: #ff8a4f; --signal-soft: #3a2114; --ok: #6cc592;
  color-scheme: dark;
}

svg text { font-family: var(--f-body); font-size: 13px; fill: currentColor; }

svg .t-s { font-size: 11.5px; fill: var(--muted); }

svg .t-b { font-weight: 600; }

svg .t-sig { fill: var(--signal); font-weight: 600; }

svg .t-acc { fill: var(--blue); font-weight: 600; }

svg .ln { stroke: currentColor; fill: none; stroke-width: 1.6; }

svg .thin { stroke: var(--muted); fill: none; stroke-width: 1; }

svg .lead { stroke: var(--muted); fill: none; stroke-width: 0.9; }

svg .acc { stroke: var(--blue); fill: var(--blue-soft); stroke-width: 1.8; }

svg .accf { fill: var(--blue); stroke: none; }

svg .sig { stroke: var(--signal); fill: none; stroke-width: 2.2; }

svg .sigf { fill: var(--signal); stroke: none; }

svg .cab { stroke: var(--signal); fill: none; stroke-width: 1.8; stroke-dasharray: 6 4; }

svg .steel { stroke: currentColor; fill: var(--bg); stroke-width: 1.4; }

svg .shaft { fill: var(--muted); stroke: currentColor; stroke-width: 1; }

svg .tyre { stroke: currentColor; fill: var(--line); stroke-width: 1.4; }

svg .box { stroke: currentColor; fill: var(--surface); stroke-width: 1.4; }

svg .alu { stroke: currentColor; fill: var(--line); stroke-width: 1.2; }

svg .hid { stroke: var(--muted); fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; }

svg .hidb { stroke: var(--signal); fill: none; stroke-width: 1.4; stroke-dasharray: 4 3; }

svg .cheek { stroke: currentColor; fill: var(--blue); fill-opacity: .28; stroke-width: 1.4; }

svg .bolt { fill: var(--signal); fill-opacity: .85; stroke: none; }

svg .co { fill: var(--signal); stroke: var(--surface); stroke-width: 2; }

svg .co-t { fill: var(--surface); font-weight: 600; font-size: 12px; }

svg .axis { stroke: var(--blue); stroke-width: 1.1; stroke-dasharray: 10 3 2 3; fill: none; }</style><defs><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><line x1="20" y1="420" x2="980" y2="420" class="thin"/><rect x="766.8" y="132.5" width="92" height="287.5" class="tyre" rx="26"/><rect x="776" y="180.8" width="73.6" height="190.9" class="acc" rx="8"/><rect x="736.9" y="267.1" width="39.1" height="18.4" class="shaft"/><rect x="548.3" y="265.9" width="213.9" height="34.5" class="alu"/><rect x="730" y="261.3" width="32.2" height="39.1" class="alu"/><rect x="596.6" y="271.6" width="69" height="5.8" class="hid"/><rect x="640.3" y="56.6" width="25.3" height="203.5" class="steel" fill="var(--blue-soft)"/><rect x="666.8" y="40.5" width="4.6" height="194.3" class="hid"/><rect x="671.4" y="223.4" width="42.5" height="23" class="box"/><rect x="713.9" y="223.9" width="11.5" height="21.8" class="sigf"/><rect x="596.6" y="260.1" width="69" height="5.8" class="steel"/><rect x="643.8" y="246.4" width="9.2" height="42.5" class="bolt"/><rect x="609.2" y="246.4" width="9.2" height="42.5" class="bolt"/><rect x="594.3" y="202.7" width="69" height="57.5" class="cheek"/><circle cx="628.8" cy="218.4" r="5.8" class="sigf"/><rect x="141.2" y="132.5" width="92" height="287.5" class="tyre" rx="26"/><rect x="150.4" y="180.8" width="73.6" height="190.9" class="acc" rx="8"/><rect x="224" y="267.1" width="39.1" height="18.4" class="shaft"/><rect x="237.8" y="265.9" width="213.9" height="34.5" class="alu"/><rect x="237.8" y="261.3" width="32.2" height="39.1" class="alu"/><rect x="334.4" y="271.6" width="69" height="5.8" class="hid"/><rect x="334.4" y="56.6" width="25.3" height="203.5" class="steel" fill="var(--blue-soft)"/><rect x="328.6" y="40.5" width="4.6" height="194.3" class="hid"/><rect x="286.1" y="223.4" width="42.5" height="23" class="box"/><rect x="274.6" y="223.9" width="11.5" height="21.8" class="sigf"/><rect x="334.4" y="260.1" width="69" height="5.8" class="steel"/><rect x="347" y="246.4" width="9.2" height="42.5" class="bolt"/><rect x="381.5" y="246.4" width="9.2" height="42.5" class="bolt"/><rect x="336.7" y="202.7" width="69" height="57.5" class="cheek"/><circle cx="371.2" cy="218.4" r="5.8" class="sigf"/><rect x="451.7" y="269.4" width="96.6" height="25.3" class="alu"/><line x1="500" y1="294.6" x2="500" y2="269.4" class="thin"/><rect x="270" y="225.9" width="460" height="17.9" class="shaft"/><rect x="325.2" y="40.5" width="349.6" height="16.1" class="steel" fill="var(--blue-soft)"/><rect x="235.5" y="24.4" width="529" height="16.1" class="steel"/><text x="500" y="38.2" text-anchor="middle" class="t-s">рама тележки</text><line x1="347.1" y1="102.6" x2="653" y2="102.6" class="lead" marker-start="url(#arA)" marker-end="url(#arA)"/><text x="500" y="96.6" text-anchor="middle" class="t-s">≈266 между ногами — ноги стоят на половинах рамы</text><line x1="431" y1="32.5" x2="327.5" y2="6" class="lead"/><circle cx="327.5" cy="6" r="10" class="co"/><text x="327.5" y="10.3" text-anchor="middle" class="co-t">1</text><line x1="347.1" y1="148.6" x2="431" y2="148.6" class="lead"/><circle cx="431" cy="148.6" r="10" class="co"/><text x="431" y="152.9" text-anchor="middle" class="co-t">2</text><line x1="596.6" y1="217.6" x2="523" y2="155.5" class="lead"/><circle cx="523" cy="155.5" r="10" class="co"/><text x="523" y="159.8" text-anchor="middle" class="co-t">3</text><line x1="631.1" y1="263.6" x2="654.1" y2="337.2" class="lead"/><circle cx="654.1" cy="337.2" r="10" class="co"/><text x="654.1" y="341.5" text-anchor="middle" class="co-t">4</text><line x1="596.6" y1="282" x2="539.1" y2="337.2" class="lead"/><circle cx="539.1" cy="337.2" r="10" class="co"/><text x="539.1" y="341.5" text-anchor="middle" class="co-t">5</text><line x1="628.8" y1="218.4" x2="628.8" y2="149.8" class="lead"/><circle cx="628.8" cy="149.8" r="10" class="co